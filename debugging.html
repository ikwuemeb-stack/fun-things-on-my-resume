<!DOCTYPE html>
<html>

<head>
    <title>Debugging Practice</title>

    <script>

    function fun()
    {
        var x = "JavaScript is fun. ";

        document.getElementById("change").innerHTML =
        x + x + x + x + x;
    }

    </script>

</head>

<body>

<button onclick="fun()">Click Me</button>

<p id="change">This will change</p>

</body>
</html>
